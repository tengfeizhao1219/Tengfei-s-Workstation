<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词本 - 版本B (卡片丰富)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #f59e0b;
            --accent: #10b981;
            --bg-gradient: linear-gradient(135deg, #fdf4ff 0%, #fce7f3 100%);
            --card-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.1), 0 10px 10px -5px rgba(139, 92, 246, 0.04);
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            color: #1f2937;
        }
        
        .word-card-rich {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #f3f4f6;
        }
        
        .word-card-rich:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--card-shadow);
            border-color: var(--primary);
        }
        
        .card-header {
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            color: white;
            padding: 20px;
        }
        
        .difficulty-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        
        .difficulty-easy { background: #10b981; }
        .difficulty-medium { background: #f59e0b; }
        .difficulty-hard { background: #ef4444; }
        
        .btn-glow {
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 rgba(139, 92, 246, 0.3);
        }
        
        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }
        
        .tag-rich {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            background: linear-gradient(135deg, #f3e8ff, #e9d5ff);
            color: var(--primary);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 8px;
            margin-bottom: 8px;
            border: 1px solid #ddd6fe;
        }
        
        .progress-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: conic-gradient(var(--primary) 75%, #e5e7eb 0);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .progress-circle-inner {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--primary);
        }
        
        .flip-card-3d {
            perspective: 1500px;
        }
        
        .flip-card-3d-inner {
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        .flip-card-3d.flipped .flip-card-3d-inner {
            transform: rotateY(180deg);
        }
        
        .flip-card-3d-front, .flip-card-3d-back {
            backface-visibility: hidden;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        
        .flip-card-3d-back {
            transform: rotateY(180deg);
        }
        
        /* 动画效果 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); }
            50% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.6); }
        }
        
        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
        
        .pulse-glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .word-grid-rich {
                grid-template-columns: 1fr !important;
            }
            
            .card-header {
                padding: 16px;
            }
        }
        
        /* 装饰元素 */
        .decoration-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0.3;
            position: absolute;
        }
        
        .wave-pattern {
            background-image: radial-gradient(circle at 1px 1px, rgba(139, 92, 246, 0.1) 1px, transparent 0);
            background-size: 20px 20px;
        }
    </style>
</head>
